syntax = "proto3";

option csharp_namespace = "Fleet.Grpc";
package fleet;

// Читання даних автопарку та кур'єрів для внутрішніх сервісів
service FleetService {
  rpc GetCourier (GetCourierRequest) returns (CourierReply);
  rpc GetCouriersByIds (GetCouriersByIdsRequest) returns (CouriersReply);
}

message GetCourierRequest {
  int64 id = 1;
}

message GetCouriersByIdsRequest {
  repeated int64 ids = 1;
}

message CourierReply {
  int64 id = 1;
  int64 warehouse_id = 2;
  string warehouse_code = 3;
  string full_name = 4;
  string phone = 5;
  string status = 6;
  string warehouse_name = 7;
}

message CouriersReply {
  repeated CourierReply couriers = 1;
}

